pluginManagement {
    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases" }
        gradlePluginPortal()
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "0.8.0"
}

rootProject.name = "create-architectury"

include("common")
include("fabric")
include("neoforge")

include("flywheel")
project(":flywheel").projectDir = file("fabric-modules/flywheel")

include("milk")
project(":milk").projectDir = file("fabric-modules/milk")

include("porting_lib_ufo")
project(":porting_lib_ufo").projectDir = file("fabric-modules/porting_lib_ufo")

include("registrate_fabric")
project(":registrate_fabric").projectDir = file("fabric-modules/registrate_fabric")

