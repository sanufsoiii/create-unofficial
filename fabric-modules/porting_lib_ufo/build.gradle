loom {
    accessWidenerPath = file("src/main/resources/porting_lib_ufo.accesswidener")
    mixin {
        defaultRefmapName.set("porting_lib_ufo-refmap.json")
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.3"
    modImplementation "com.electronwill.night-config:core:3.8.0"
    modImplementation "com.electronwill.night-config:toml:3.8.0"
    include "commons-logging:commons-logging:1.3.3"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"
}
