plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"

    // Architectury API
    modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionFabric")

    // Flywheel Fabric
    modCompileOnly "dev.engine-room.flywheel:flywheel-fabric-api-$rootProject.minecraft_version:$rootProject.flywheel_version"
    modRuntimeOnly "dev.engine-room.flywheel:flywheel-fabric-$rootProject.minecraft_version:$rootProject.flywheel_version"

    // Registrate Fabric
    modImplementation "com.tterrag.registrate_fabric:Registrate:1.3.77-MC1.21.1"

    // Porting Lib (Fabric port utilities)
    def portingLib = '3.1.0-beta.47+1.21.1'
    ['core', 'base', 'extensions', 'entity', 'accessors', 'transfer', 'models', 'model_loader', 'tags', 'blocks', 'fluids'].each { module ->
        modImplementation "io.github.fabricators_of_create.Porting-Lib:${module}:${portingLib}"
    }
    modImplementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.3"

    // Ponder Fabric
    modImplementation "net.createmod.ponder:ponder-fabric:$rootProject.ponder_version+mc$rootProject.minecraft_version"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
